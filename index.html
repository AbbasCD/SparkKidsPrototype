  <script>
    /* Build label (stamp.py) + TEMPORARY on-screen error box for phone testing */
    window.SPARK_BUILD = "b20";
    window.addEventListener("error", function (e) {
      var box = document.getElementById("spark-err");
      if (!box) { box = document.createElement("div"); box.id = "spark-err";
        box.style.cssText = "position:absolute;left:12px;right:12px;top:40%;z-index:99999;padding:12px;border-radius:12px;background:#c62828;color:#fff;font:13px/1.4 -apple-system,system-ui,sans-serif;white-space:pre-line";
        (document.body || document.documentElement).appendChild(box); }
      box.textContent += "Error (build " + window.SPARK_BUILD + "): " + e.message + "\n" + (e.filename || "").split("/").pop() + " line " + e.lineno + "\n";
    });
  </script>
